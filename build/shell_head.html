<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Cat Watch</title>
<style>
  /* The app owns its palette (PALETTES in the component) and now ships TWO —
     her request, 20 Sep 2026: "it's 9pm and this cream background with light
     grey text is v difficult to read."

     These tokens exist so the page paints a ground before React runs. The
     component sets data-theme on <html> as soon as it mounts; until then the
     browser's own preference decides, so a dark-mode machine never flashes
     cream on the way in. Her explicit choice, once made, wins over both. */
  :root { --ground: #E8E4DE; --ink: #1E1B18; color-scheme: light; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --ground: #1A1815; --ink: #EDE8E0; color-scheme: dark; }
  }
  :root[data-theme="dark"]  { --ground: #1A1815; --ink: #EDE8E0; color-scheme: dark; }
  :root[data-theme="light"] { --ground: #E8E4DE; --ink: #1E1B18; color-scheme: light; }

  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  #root { min-height: 100%; }
  /* The component sets its own inner padding; this only guarantees the gutter
     never closes up at phone width. */
  @media (max-width: 420px) { #root { padding-inline: 0; } }
</style>

<div id="root"></div>
